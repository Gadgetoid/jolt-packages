name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      JOLT_RELEASE: v1.0.0
      JORNADA_LLVM_RELEASE: v3
      LLVM_NAME: velo-llvm-v3-linux-x86_64
    steps:
      - uses: actions/checkout@v7

      - name: Download the Windows CE LLVM
        run: |
          url=https://github.com/Gadgetoid/velo-llvm-builds/releases/download/$JORNADA_LLVM_RELEASE
          curl -fsSLO $url/$LLVM_NAME.tar.xz
          curl -fsSLO $url/$LLVM_NAME.tar.xz.sha256
          shasum -a 256 -c $LLVM_NAME.tar.xz.sha256
          tar xf $LLVM_NAME.tar.xz -C "$RUNNER_TEMP"
          echo "JORNADA_LLVM_ROOT=$RUNNER_TEMP/$LLVM_NAME" >> "$GITHUB_ENV"

      - name: Download the JoLT SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$JOLT_RELEASE" -R Gadgetoid/jolt -p "jolt-sdk-*.tar.gz" -D "$RUNNER_TEMP"
          tar xzf "$RUNNER_TEMP"/jolt-sdk-*.tar.gz -C "$RUNNER_TEMP"
          echo "JOLT_SDK_DIR=$(ls -d "$RUNNER_TEMP"/jolt-sdk-*/)" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: build/sources
          key: sources-${{ hashFiles('packages/*/PKGBUILD') }}
          restore-keys: sources-

      - name: Build packages
        run: SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) tools/build.sh

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
